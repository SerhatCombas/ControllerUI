# Engineering System Designer — CI Pipeline
#
# Implements the 5-stage pipeline from `12_ci_cd_pipeline.md`:
#   Stage 1: Setup
#   Stage 2: Lint
#   Stage 3: Test (architecture → unit → integration → gui → slow)
#   Stage 4: Security
#   Stage 5: Deploy (tags only)

name: CI

on:
  push:
    branches:
      - main
      - develop
      - "release/*"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Weekly run on main to catch dependency drift (Sundays at 03:00 UTC)
    - cron: "0 3 * * 0"
  workflow_dispatch:

# Cancel in-progress runs on the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ------------------------------------------------------------------------------
jobs:

  # =============================================================================
  # Stage 2 — Lint
  # =============================================================================
  lint:
    name: Lint (Ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check formatting (ruff format)
        run: ruff format --check src tests

      - name: Lint (ruff check)
        run: ruff check src tests

      - name: Type-check (mypy)
        run: mypy --config-file pyproject.toml src

  # =============================================================================
  # Stage 3 — Test Wave 1: Architecture
  # =============================================================================
  test-architecture:
    name: Test (architecture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run architecture tests
        run: pytest -m architecture --strict-markers -v

  # =============================================================================
  # Stage 3 — Test Wave 2: Unit (with coverage)
  # =============================================================================
  test-unit:
    name: Test (unit)
    needs: test-architecture
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: pytest -m unit --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # =============================================================================
  # Stage 3 — Test Wave 3: Integration
  # =============================================================================
  test-integration:
    name: Test (integration)
    needs: test-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run integration tests
        run: pytest -m integration -v

  # =============================================================================
  # Stage 3 — Test Wave 4: GUI (Xvfb)
  # =============================================================================
  test-gui:
    name: Test (gui)
    needs: test-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libegl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run GUI tests
        run: xvfb-run -a pytest -m gui -v

  # =============================================================================
  # Stage 3 — Test Wave 5: Slow (main / release branches only)
  # =============================================================================
  test-slow:
    name: Test (slow)
    needs: test-gui
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run slow tests
        run: pytest -m slow --timeout=300 -v

  # =============================================================================
  # Stage 4 — Security (parallel with test waves)
  # =============================================================================
  security:
    name: Security (safety + bandit)
    needs: test-architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install safety bandit

      - name: Check for known vulnerabilities (safety)
        run: safety check --file requirements.txt --output text
        continue-on-error: false

      - name: Static security analysis (bandit)
        run: bandit -r src -ll -f txt
        continue-on-error: true

  # =============================================================================
  # Stage 5 — Deploy (tags only)
  # =============================================================================
  deploy:
    name: Deploy (build + GitHub Release)
    needs: [lint, test-gui, security]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build distribution
        run: python -m build

      - name: Verify wheel installs cleanly
        run: |
          python -m venv verify-env
          ./verify-env/bin/pip install dist/*.whl
          ./verify-env/bin/python -c "import system_designer; print('OK')"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
